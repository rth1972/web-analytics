<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
  <!-- Grid lines -->
  <line x1="80" y1="380" x2="432" y2="380" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <line x1="80" y1="320" x2="432" y2="320" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <line x1="80" y1="260" x2="432" y2="260" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <line x1="80" y1="200" x2="432" y2="200" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <!-- Bars -->
  <rect x="88"  y="290" width="72" height="106" rx="14" fill="#ffffff" fill-opacity="0.55"/>
  <rect x="188" y="220" width="72" height="176" rx="14" fill="#ffffff" fill-opacity="0.75"/>
  <rect x="288" y="140" width="72" height="256" rx="14" fill="#ffffff" fill-opacity="1"/>
